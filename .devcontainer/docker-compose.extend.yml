version: '3.9'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - ../../omop_vocab:/omop_vocab:ro
      # SSH agent forwarding — lets git inside the container use your Mac's SSH keys.
      # Docker Desktop for Mac exposes the host SSH agent at this path.
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock
    command: sleep infinity
    networks:
      - omop_dev_network
    env_file:
      - ../../.env
    environment:
      MSSQL_HOST: mssql_dev
      OHDSI_VOCAB_CSV_DIR: /omop_vocab

networks:
  omop_dev_network:
    external: true
