# =============================================================================
# consumers.yaml — the Strategus studies that use this synthetic dataset
#
# Tracks which downstream studies depend on the dataset this -synth repo
# generates. It is the dataset's specification, used at three points so that
# regenerating or editing the dataset cannot silently break a study:
#   workflow/02  lists each listed study's cohorts (what must be covered)
#   workflow/03  scripts/module_coverage_check.R checks the Synthea module (custom
#                + built-in modules) CAN produce them, before generation
#   workflow/06  scripts/consumer_cohort_qc.R instantiates them against the final
#                synthetic CDM and fails any that is empty or too small
#
# In a Strategus study the cohort roles are: ONE target cohort, the outcome
# cohorts, and every other cohort in inst/Cohorts.csv is a covariate cohort.
# So listing a study checks its cohorts, outcomes and covariates together.
#
# Keep this file in step with the workspace registry: every study here should
# also appear in synthetic_data/registry.yaml `used_by` for this dataset (and
# `consumes_dataset` in studies.yaml). QC warns when they disagree.
#
#   dataset_id   this dataset's `id` in synthetic_data/registry.yaml
#
#   consumers:   one entry per consuming Strategus study
#     study                    directory name of the study repo (REQUIRED).
#                              It is cloned beside this repo in the workspace.
#     repo_dir                 optional path override (absolute, or relative to
#                              this repo). Default: ../<study>
#     cohorts_manifest         default inst/Cohorts.csv
#     cohorts_json_dir         default inst/cohorts
#     spec_script              default CreateStrategusAnalysisSpecification.R
#     target_id, outcome_ids   optional. By default they are read from
#                              targetId / outcomeIds in spec_script. Set them
#                              here if that script cannot be parsed.
#     expected_empty           optional list of cohort ids the study knows are EMPTY
#                              on synthetic data (e.g. an outcome Synthea does not
#                              generate). They get no minimum and are reported with
#                              a note instead of failing.
#     discharge_disposition_check  default false. Set true for a study whose analysis
#                              depends on discharge disposition (e.g. a non-home
#                              discharge outcome). Its cohort is hand-authored SQL that
#                              Strategus never runs, so the cohort check passes even when
#                              the dataset carries no dispositions; this check reads
#                              visit_occurrence and verifies they were loaded, mapped,
#                              and include home (NUBC 01) and non-home discharge. QC warns
#                              when a consumer's cohort SQL reads discharged_to_* but this
#                              is not set. Optional thresholds: min_discharge_visits (1),
#                              min_non_home_visits (1), min_discharge_mapped_pct (90).
#     min_target_subjects      default 100  people required in the target cohort
#     min_outcome_subjects     default 10   outcome people who are ALSO in the
#                              target cohort (per outcome cohort)
#     min_covariate_subjects   default 1    people required in each covariate cohort
#
#   not_checked: studies named in the registry's `used_by` that are deliberately
#     NOT QC'd here, e.g. a retired study or a consumer that is not a Strategus
#     repo (a federated PLP study). Listing them records the decision and stops
#     the registry-agreement warning. The producing repo itself is ignored
#     automatically.
#
# Rule 1 does not apply here: this file holds study names and thresholds, not
# concept IDs. The concept sets live in each study's own cohort definitions.
# =============================================================================

dataset_id: my_study_synth_dataset   # TODO [CONFIG]: your dataset's id in synthetic_data/registry.yaml

consumers: []
# not_checked: [some-retired-study]
# consumers:
#   - study: my-study-desc
#     min_target_subjects: 100
#     min_outcome_subjects: 10
#     min_covariate_subjects: 1
#     discharge_disposition_check: true   # only for discharge-disposition analyses
